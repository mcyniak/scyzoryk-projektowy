name: Zbuduj instalator deweloperski z OCR

# Wariant wewnetrzny oparty na build-internal-installer.yml, ale z dolaczona
# konfiguracja Google Document AI. Buduje aktualny system instalowania:
# pelny instalator Setup + maly instalator Update, a potem testuje oba.
# Artefakty zawieraja sekret OCR, wiec workflow moze dzialac tylko w prywatnym
# repozytorium i nie publikuje niczego jako GitHub Release.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: deweloperski-instalator-z-ocr-${{ github.ref }}
  cancel-in-progress: true

env:
  OCR_DOCAI_PROJECT_ID: scyzoryk-ocr-test
  OCR_DOCAI_LOCATION: eu
  OCR_DOCAI_PROCESSOR_ID: c8cea9ff6f6430c3

jobs:
  build:
    name: Zbuduj instalator z OCR
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Sprawdz, ze repozytorium jest prywatne
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repoPrivate = (gh api "repos/${{ github.repository }}" --jq '.private').Trim()
          if ($repoPrivate -ne 'true') {
            throw "Repozytorium ${{ github.repository }} nie jest prywatne. Nie wolno budowac instalatora z sekretem OCR."
          }
          Write-Host 'Repozytorium jest prywatne - mozna bezpiecznie uzyc sekretu OCR.'

      - name: Sprawdz sekret OCR
        shell: pwsh
        env:
          OCR_DOCAI_CREDENTIALS_B64: ${{ secrets.OCR_DOCAI_CREDENTIALS_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:OCR_DOCAI_CREDENTIALS_B64)) {
            throw 'Brakuje GitHub Actions Secret: OCR_DOCAI_CREDENTIALS_B64.'
          }
          try {
            $bytes = [Convert]::FromBase64String($env:OCR_DOCAI_CREDENTIALS_B64)
            $json = [Text.Encoding]::UTF8.GetString($bytes) | ConvertFrom-Json
          } catch {
            throw 'OCR_DOCAI_CREDENTIALS_B64 nie jest poprawnym plikiem JSON zakodowanym Base64.'
          }
          if ($json.type -ne 'service_account' -or [string]::IsNullOrWhiteSpace([string]$json.private_key)) {
            throw 'Sekret OCR nie zawiera kompletnego konta serwisowego Google Cloud.'
          }
          Write-Host 'Sekret OCR jest dostepny i ma poprawny format.'

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Przygotuj .NET SDK (launcher Scyzoryk.exe)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Upewnij sie, ze Inno Setup jest dostepny
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) { choco install innosetup --no-progress -y }

      - name: Zbuduj instalatory deweloperskie z OCR (pelny + aktualizacyjny)
        shell: pwsh
        env:
          OCR_DOCAI_CREDENTIALS_B64: ${{ secrets.OCR_DOCAI_CREDENTIALS_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          npm run build-installer
          Get-ChildItem release | Format-Table Name, Length

      - name: Przekaz instalatory i fingerprint runtime do testu
        uses: actions/upload-artifact@v4
        with:
          name: techniczny-instalator-z-ocr-${{ github.run_id }}
          path: |
            release/*.exe
            release/runtime-fingerprint.txt
          if-no-files-found: error
          retention-days: 1

  test:
    name: Swieza instalacja z OCR i pelne testy
    needs: build
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - name: Pobierz skrypty testowe
        uses: actions/checkout@v4

      - name: Pobierz instalator z poprzedniego joba
        uses: actions/download-artifact@v4
        with:
          name: techniczny-instalator-z-ocr-${{ github.run_id }}
          path: artifact

      - name: Przygotuj sciezki
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'artifact\ScyzorykProjektowy-Setup-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Nie znaleziono pelnego instalatora (ScyzorykProjektowy-Setup-*.exe).' }
          $updateInstaller = Get-ChildItem 'artifact\ScyzorykProjektowy-Update-*.exe' | Select-Object -First 1
          if (-not $updateInstaller) { throw 'Nie znaleziono instalatora aktualizacyjnego (ScyzorykProjektowy-Update-*.exe).' }
          $installDir = Join-Path $env:RUNNER_TEMP 'Scyzoryk Test swieza instalacja z OCR'
          $logsDir = Join-Path $env:RUNNER_TEMP 'scyzoryk-test-logs-z-ocr'
          New-Item -ItemType Directory -Force -Path $logsDir | Out-Null
          "INSTALLER_FILE=$($installer.FullName)" >> $env:GITHUB_ENV
          "UPDATE_INSTALLER_FILE=$($updateInstaller.FullName)" >> $env:GITHUB_ENV
          "INSTALL_DIR=$installDir" >> $env:GITHUB_ENV
          "LOGS_DIR=$logsDir" >> $env:GITHUB_ENV

      - name: Zainstaluj i przetestuj caly Scyzoryk z OCR (w tym maly instalator aktualizacyjny)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\scripts\ci\test-installed-scyzoryk.ps1' `
            -InstallerPath $env:INSTALLER_FILE `
            -UpdateInstallerPath $env:UPDATE_INSTALLER_FILE `
            -InstallDir $env:INSTALL_DIR `
            -LogsDir $env:LOGS_DIR `
            -ExpectBundledOcr `
            -TestLiveOcr

      - name: Przeslij raporty i zrzuty ekranow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raport-testow-instalatora-z-ocr
          path: ${{ env.LOGS_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Udostepnij przetestowany instalator deweloperski z OCR
        uses: actions/upload-artifact@v4
        with:
          name: Scyzoryk-Projektowy-DEWELOPERSKI-z-OCR
          path: artifact/*.exe
          if-no-files-found: error
          retention-days: 3

      - name: Usun techniczny artefakt posredni
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = 'techniczny-instalator-z-ocr-${{ github.run_id }}'
          $response = gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" | ConvertFrom-Json
          $artifact = $response.artifacts | Where-Object { $_.name -eq $name } | Select-Object -First 1
          if ($artifact) {
            gh api --method DELETE "/repos/${{ github.repository }}/actions/artifacts/$($artifact.id)"
          }
