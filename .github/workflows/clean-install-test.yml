name: Test czystej instalacji (Windows)

# Buduje PRAWDZIWY instalator Windows (installer/scyzoryk.iss, patrz scripts/build-installer.ps1),
# a nastepnie na OSOBNYM, swiezym uruchomieniu windows-latest instaluje aplikacje TYM instalatorem
# (nie odpala kodu zrodlowego bezposrednio) i wykonuje smoke testy najwazniejszych funkcji.
#
# Instalator bundluje wlasny, przenosny Node.js (node-runtime/) - aplikacja NIE wymaga Node.js/npm
# zainstalowanego globalnie na komputerze uzytkownika. Krok uruchomienia aplikacji w drugim jobie
# celowo dziala z PATH ograniczonym do samego Windows + tego bundlowanego runtime (bez dostepu do
# Node/npm/Python preinstalowanych na obrazie windows-latest), zeby wykryc ukryte zaleznosci od
# globalnie zainstalowanych narzedzi.
#
# Ograniczenia (patrz tez opis PR/README): Microsoft Word nie jest zainstalowany na hostowanym
# runnerze windows-latest, wiec "Dokumenty seryjne"/"Wnioski powykonawcze" sa tu ograniczone do
# health-checka (prawdziwa generacja przez Word COM nie jest testowalna w tym srodowisku). OCR
# audytow rowniez ograniczony do health-checka - prawdziwe wywolanie Google Document AI wymagaloby
# platnych, sekretnych danych logowania, ktorych ten workflow celowo nie uzywa. Konto uruchamiajace
# hostowany runner windows-latest ma uprawnienia administratora (ograniczenie GitHub-hostowanego
# runnera) - testowalne jest tylko to, ze SAM instalator nie wymaga podniesienia uprawnien
# (PrivilegesRequired=lowest, /CURRENTUSER).

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'lib/**'
      - 'server.js'
      - 'package.json'
      - 'scripts/**'
      - 'installer/**'
      - '.github/workflows/clean-install-test.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'lib/**'
      - 'server.js'
      - 'package.json'
      - 'scripts/**'
      - 'installer/**'
      - '.github/workflows/clean-install-test.yml'

permissions:
  contents: read

jobs:
  build-installer:
    name: Zbuduj instalator
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: "Node.js (tylko do ZBUDOWANIA instalatora - to NIE jest Node.js testowany w kroku czystej instalacji)"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Upewnij się, że kompilator Inno Setup jest dostępny
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            Write-Host "Inno Setup nie znaleziony w standardowej lokalizacji obrazu windows-latest - instaluje przez Chocolatey..."
            choco install innosetup --no-progress -y
          } else {
            Write-Host "Inno Setup juz obecny na obrazie runnera: $found"
          }

      - name: Zbuduj produkcyjny instalator (.exe, Inno Setup, bundlowany portable Node.js)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run build-installer

      - name: Wypisz zawartość release/
        shell: pwsh
        run: Get-ChildItem release | Format-Table Name, Length

      - name: Prześlij instalator jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: instalator-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  clean-install-test:
    name: Czysta instalacja i smoke testy
    needs: build-installer
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: "Pobierz kod repozytorium (WYŁĄCZNIE pomocnicze skrypty testowe scripts/ci/* - to NIE jest aplikacja pod testem, ta pochodzi z zainstalowanego instalatora)"
        uses: actions/checkout@v4

      - name: Pobierz zbudowany instalator
        uses: actions/download-artifact@v4
        with:
          name: instalator-windows
          path: artifact

      - name: Przygotuj ścieżki na instalację i logi (celowo ze spacją i polskimi znakami)
        id: paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Sciezka instalacji CELOWO zawiera spacje i polskie znaki diakrytyczne -
          # patrz wymog obslugi takich sciezek. RUNNER_TEMP jest zapisywalny bez
          # uprawnien administratora.
          $installDir = Join-Path $env:RUNNER_TEMP 'Ścieżka Testowa ążśźćłóęń Scyzoryk'
          $logsDir = Join-Path $env:RUNNER_TEMP 'scyzoryk-ci-logs'
          foreach ($sub in 'install','app-logs','reports','input','screenshots','app-internal-logs') {
            New-Item -ItemType Directory -Force -Path (Join-Path $logsDir $sub) | Out-Null
          }
          "INSTALL_DIR=$installDir" >> $env:GITHUB_ENV
          "LOGS_DIR=$logsDir" >> $env:GITHUB_ENV
          Write-Host "INSTALL_DIR = $installDir"
          Write-Host "LOGS_DIR    = $logsDir"

      - name: "Zainstaluj aplikację przygotowanym instalatorem (świeża maszyna, bez podnoszenia uprawnień)"
        id: install
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "Konto runnera ma uprawnienia administratora: $isAdmin (ograniczenie hostowanego runnera GitHub - patrz uwagi na gorze pliku workflow)."
          $installer = Get-ChildItem "artifact\*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) { throw "Nie znaleziono pliku instalatora w pobranym artefakcie." }
          Write-Host "Instaluje: $($installer.FullName)"
          $installLog = Join-Path $env:LOGS_DIR 'install\install.log'
          # UWAGA: Start-Process -ArgumentList NIE cytuje automatycznie elementow ze
          # spacjami (potwierdzone realnym testem lokalnym - /DIR bez cudzyslowia
          # cichutko obcina sie na pierwszej spacji, Inno Setup dostaje tylko fragment
          # sciezki). INSTALL_DIR celowo zawiera spacje/polskie znaki, wiec kazda
          # wartosc MUSI byc opakowana w wewnetrzny literal cudzyslow.
          $args = @('/VERYSILENT','/SUPPRESSMSG','/NORESTART','/CURRENTUSER',"/DIR=""$env:INSTALL_DIR""","/LOG=""$installLog""")
          $proc = Start-Process -FilePath $installer.FullName -ArgumentList $args -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Instalator zakonczyl sie kodem $($proc.ExitCode) - zobacz install.log w artefaktach." }
          Write-Host "Instalacja OK (kod wyjscia 0), instalator NIE zadal podniesienia uprawnien (PrivilegesRequired=lowest, /CURRENTUSER)."

      - name: Zweryfikuj strukturę zainstalowanej aplikacji i bundlowany Chromium (Playwright)
        id: verify
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'server.js','package.json','node-runtime\node.exe','unins000.exe',
            'apps\drukarka\node_modules\express',
            'apps\pieczatki-pdf\node_modules\express',
            'apps\formularze-ecodan\node_modules\playwright',
            'apps\dokumenty-seryjne\node_modules\express',
            'apps\wnioski-powykonawcze\node_modules\express',
            'apps\karty-katalogowe\node_modules\express',
            'apps\drukarka-projekty\node_modules\express',
            'apps\ocr-audytow\node_modules\express'
          )
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $env:INSTALL_DIR $_)) }
          if ($missing) {
            $missing | ForEach-Object { Write-Host "BRAK: $_" }
            throw "Instalacja niekompletna - brakuje $($missing.Count) elementow."
          }
          $node = Join-Path $env:INSTALL_DIR 'node-runtime\node.exe'
          Push-Location (Join-Path $env:INSTALL_DIR 'apps\formularze-ecodan')
          try {
            $script = "const fs=require('fs');const {chromium}=require('playwright');const p=chromium.executablePath();if(!fs.existsSync(p)){console.error('Brak Chromium: '+p);process.exit(1);}console.log('Chromium OK: '+p);"
            & $node -e $script
            if ($LASTEXITCODE -ne 0) { throw "Chromium dla Playwright nie zostal poprawnie zainstalowany przez instalator." }
          } finally { Pop-Location }
          Write-Host "Struktura instalacji OK - wszystkie 8 aplikacji ma zainstalowane zaleznosci, Chromium obecny."

      - name: "Sprawdź brak wyciekniętych ścieżek/nazwy konta z komputera dewelopera"
        id: no_leaked_paths
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $textFiles = Get-ChildItem -Path $env:INSTALL_DIR -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\node_modules\\|\\node-runtime\\' -and $_.Extension -match '^\.(js|cmd|ps1|json|md|html|css|txt)$' }
          $hits = @()
          foreach ($f in $textFiles) {
            $content = Get-Content -Raw -Path $f.FullName -ErrorAction SilentlyContinue
            if ($content -and ($content -match 'Piotr\.Cyniak')) { $hits += $f.FullName }
          }
          if ($hits.Count -gt 0) {
            $hits | ForEach-Object { Write-Host "ZNALEZIONO SCIEZKE Z KOMPUTERA DEWELOPERA W: $_" }
            throw "Zainstalowana aplikacja zawiera odniesienia do konta/komputera dewelopera."
          }
          Write-Host "OK - brak wyciekniętych ścieżek/nazwy konta dewelopera w zainstalowanych plikach."

      - name: "Test regresyjny: sortowanie dokumentów Drukarki projekty (najbardziej krytyczna logika biznesowa)"
        id: test_drukarka_projekty
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $node = Join-Path $env:INSTALL_DIR 'node-runtime\node.exe'
          Push-Location (Join-Path $env:INSTALL_DIR 'apps\drukarka-projekty')
          try {
            & $node test-sorting-regression.js
            if ($LASTEXITCODE -ne 0) { throw "Test regresyjny sortowania dokumentow NIE PRZESZEDL." }
          } finally { Pop-Location }
          Write-Host "OK - test regresyjny sortowania dokumentow przeszedl na zainstalowanej kopii (uzywajac bundlowanego node-runtime)."

      - name: Wygeneruj przykładowy plik PDF (ścieżka ze spacją i polskimi znakami)
        id: sample_pdf
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $node = Join-Path $env:INSTALL_DIR 'node-runtime\node.exe'
          $inputDir = Join-Path $env:LOGS_DIR 'input'
          & $node "scripts\ci\create-sample-pdf.js" (Join-Path $inputDir 'przykładowy plik ążę.pdf')
          if ($LASTEXITCODE -ne 0) { throw "Nie udalo sie wygenerowac przykladowego PDF testowego." }

      - name: "Uruchom zainstalowaną aplikację (PATH ograniczony do Windows + własnego node-runtime - bez globalnego Node/npm/Python)"
        id: launch
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sysRoot = $env:SystemRoot
          $restrictedPath = "$env:INSTALL_DIR\node-runtime;$sysRoot\System32;$sysRoot;$sysRoot\System32\WindowsPowerShell\v1.0;$sysRoot\System32\Wbem"
          Write-Host "PATH ograniczony dla tego procesu do:"
          Write-Host "  $restrictedPath"
          Write-Host "(brak jakiegokolwiek folderu preinstalowanego Node.js/npm/Python z obrazu windows-latest)"
          $originalPath = $env:PATH
          $env:PATH = $restrictedPath
          $outLog = Join-Path $env:LOGS_DIR 'app-logs\panel-stdout.log'
          $errLog = Join-Path $env:LOGS_DIR 'app-logs\panel-stderr.log'
          $proc = Start-Process -FilePath (Join-Path $env:INSTALL_DIR 'node-runtime\node.exe') -ArgumentList 'server.js' -WorkingDirectory $env:INSTALL_DIR -RedirectStandardOutput $outLog -RedirectStandardError $errLog -PassThru -WindowStyle Hidden
          $env:PATH = $originalPath
          "SCYZORYK_PID=$($proc.Id)" >> $env:GITHUB_ENV
          Start-Sleep -Seconds 3
          if ($proc.HasExited) {
            throw "Proces panelu zakonczyl sie natychmiast (kod $($proc.ExitCode)) - zobacz app-logs\panel-stderr.log w artefaktach."
          }
          Write-Host "Uruchomiono panel (PID $($proc.Id)) z ograniczonym PATH."

      - name: Poczekaj aż wszystkie 8 aplikacji + panel odpowiadają (health-check)
        id: health
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checks = @(
            @{ name='panel (glowny)'; port=3000; path='/api/apps' },
            @{ name='drukarka'; port=3001; path='/api/status' },
            @{ name='pieczatki-pdf'; port=3002; path='/api/health' },
            @{ name='formularze-ecodan'; port=3003; path='/api/version' },
            @{ name='dokumenty-seryjne'; port=3004; path='/api/health' },
            @{ name='wnioski-powykonawcze'; port=3005; path='/api/health' },
            @{ name='karty-katalogowe'; port=3006; path='/api/health' },
            @{ name='drukarka-projekty'; port=3010; path='/api/status' },
            @{ name='ocr-audytow'; port=3011; path='/api/health' }
          )
          $failed = @()
          foreach ($c in $checks) {
            $deadline = (Get-Date).AddSeconds(90)
            $ok = $false
            while ((Get-Date) -lt $deadline) {
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:$($c.port)$($c.path)" -UseBasicParsing -TimeoutSec 3
                if ($r.StatusCode -ge 200 -and $r.StatusCode -lt 500) { $ok = $true; break }
              } catch {}
              Start-Sleep -Seconds 2
            }
            if ($ok) { Write-Host "OK   $($c.name) (:$($c.port)$($c.path))" }
            else { $failed += $c.name; Write-Host "BLAD $($c.name) (:$($c.port)$($c.path)) - brak odpowiedzi w 90s" }
          }
          Invoke-RestMethod -Uri 'http://127.0.0.1:3000/api/apps' -TimeoutSec 10 | ConvertTo-Json -Depth 6 |
            Set-Content -Path (Join-Path $env:LOGS_DIR 'reports\api-apps.json') -Encoding utf8
          if ($failed.Count -gt 0) { throw "Nie odpowiedzialy: $($failed -join ', ')" }
          Write-Host "OK - wszystkie 9 procesow (panel + 8 aplikacji) odpowiada."

      - name: "Zrzuty ekranu każdego narzędzia (Playwright, bundlowany razem z formularze-ecodan)"
        id: screenshots
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $node = Join-Path $env:INSTALL_DIR 'node-runtime\node.exe'
          $targetsPath = Join-Path $env:LOGS_DIR 'screenshot-targets.json'
          @(
            @{slug='01-panel'; url='http://127.0.0.1:3000/'},
            @{slug='02-drukarka'; url='http://127.0.0.1:3001/'},
            @{slug='03-pieczatki-pdf'; url='http://127.0.0.1:3002/'},
            @{slug='04-formularze-ecodan'; url='http://127.0.0.1:3003/'},
            @{slug='05-dokumenty-seryjne'; url='http://127.0.0.1:3004/'},
            @{slug='06-wnioski-powykonawcze'; url='http://127.0.0.1:3005/'},
            @{slug='07-karty-katalogowe'; url='http://127.0.0.1:3006/'},
            @{slug='08-drukarka-projekty'; url='http://127.0.0.1:3010/'},
            @{slug='09-ocr-audytow'; url='http://127.0.0.1:3011/'}
          ) | ConvertTo-Json | Set-Content -Path $targetsPath -Encoding utf8
          Push-Location (Join-Path $env:INSTALL_DIR 'apps\formularze-ecodan')
          try {
            & $node (Join-Path $env:INSTALL_DIR 'scripts\ci\screenshot-all.js') (Join-Path $env:LOGS_DIR 'screenshots') $targetsPath
            if ($LASTEXITCODE -ne 0) { throw "Co najmniej jedna strona nie wyrenderowala sie poprawnie - zobacz zrzuty ekranu w artefaktach." }
          } finally { Pop-Location }
          Write-Host "OK - wszystkie strony wyrenderowane, zrzuty ekranu zapisane."

      - name: "Smoke test: Pieczątki PDF (wczytanie przykładowego PDF + realna operacja stemplowania)"
        id: test_pieczatki
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $samplePdf = Join-Path $env:LOGS_DIR 'input\przykładowy plik ążę.pdf'
          $outPdf = Join-Path $env:LOGS_DIR 'reports\pieczatki-wynik.pdf'
          $form = @{
            pdfs = Get-Item -Path $samplePdf
            stampText = 'TEST CI OK'
            xPct = '10'; yPct = '10'; widthPct = '40'; heightPct = '15'
            rotation = '0'; opacity = '1'; pageMode = 'all'; fontSize = '20'
          }
          $resp = Invoke-WebRequest -Uri 'http://127.0.0.1:3002/api/stamp' -Method Post -Form $form -Headers @{ 'X-Scyzoryk-Request' = '1' } -TimeoutSec 30 -UseBasicParsing
          if ($resp.StatusCode -ne 200) { throw "Pieczątki PDF: HTTP $($resp.StatusCode)" }
          [System.IO.File]::WriteAllBytes($outPdf, $resp.Content)
          $bytes = [System.IO.File]::ReadAllBytes($outPdf)
          if ($bytes.Length -lt 10 -or [System.Text.Encoding]::ASCII.GetString($bytes[0..3]) -ne '%PDF') {
            throw "Wynik stemplowania nie wyglada na poprawny plik PDF."
          }
          Write-Host "OK - PDF ostemplowany i utworzony na dysku: $outPdf ($($bytes.Length) B)"

      - name: "Smoke test: Drukarka (przygotowanie plików do druku, bez fizycznego drukowania)"
        id: test_drukarka
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $samplePdf = Join-Path $env:LOGS_DIR 'input\przykładowy plik ążę.pdf'
          $form = @{ files = Get-Item -Path $samplePdf }
          $resp = Invoke-RestMethod -Uri 'http://127.0.0.1:3001/api/upload' -Method Post -Form $form -Headers @{ 'X-Scyzoryk-Request' = '1' } -TimeoutSec 30
          if (-not $resp.ok) { throw "Drukarka: upload nie powiodl sie: $($resp.message)" }
          $queue = Invoke-RestMethod -Uri 'http://127.0.0.1:3001/api/queue' -TimeoutSec 10
          if (-not $queue.queue -or $queue.queue.Count -lt 1) { throw "Drukarka: kolejka jest pusta po uploadzie." }
          Write-Host "OK - plik trafil do kolejki drukowania (NIE wysylany do fizycznej drukarki): $($queue.queue.Count) pozycji."
          $queue | ConvertTo-Json -Depth 6 | Set-Content -Path (Join-Path $env:LOGS_DIR 'reports\drukarka-kolejka.json') -Encoding utf8
          Invoke-RestMethod -Uri 'http://127.0.0.1:3001/api/clear' -Method Post -Headers @{ 'X-Scyzoryk-Request' = '1' } -TimeoutSec 10 | Out-Null

      - name: "Smoke test: pozostałe narzędzia (health-check - Word COM i płatne API OCR poza zasięgiem CI, patrz uwagi na górze pliku)"
        id: test_other_apps
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checks = @(
            @{ name='dokumenty-seryjne'; port=3004; path='/api/health' },
            @{ name='wnioski-powykonawcze'; port=3005; path='/api/health' },
            @{ name='karty-katalogowe'; port=3006; path='/api/health' },
            @{ name='ocr-audytow'; port=3011; path='/api/health' }
          )
          $failed = @()
          foreach ($c in $checks) {
            try {
              $r = Invoke-RestMethod -Uri "http://127.0.0.1:$($c.port)$($c.path)" -TimeoutSec 10
              if (-not $r.ok) { throw "odpowiedz bez ok:true" }
              Write-Host "OK   $($c.name) :$($c.port)$($c.path)"
            } catch {
              $failed += $c.name
              Write-Host "BLAD $($c.name): $($_.Exception.Message)"
            }
          }
          if ($failed.Count -gt 0) { throw "Nie odpowiedzialy poprawnie: $($failed -join ', ')" }

      - name: Skopiuj wewnętrzne logi aplikacji (przed reinstalacją/deinstalacją)
        id: collect_internal_logs
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $dest = Join-Path $env:LOGS_DIR 'app-internal-logs'
          if (Test-Path (Join-Path $env:INSTALL_DIR 'logs')) {
            Copy-Item -Path (Join-Path $env:INSTALL_DIR 'logs') -Destination (Join-Path $dest 'panel') -Recurse -Force -ErrorAction SilentlyContinue
          }
          Get-ChildItem (Join-Path $env:INSTALL_DIR 'apps') -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            $appLogs = Join-Path $_.FullName 'logs'
            if (Test-Path $appLogs) {
              Copy-Item -Path $appLogs -Destination (Join-Path $dest $_.Name) -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Write-Host "Skopiowano logi wewnetrzne aplikacji do: $dest"

      - name: Zatrzymaj uruchomioną aplikację (wszystkie procesy tej instalacji)
        id: stop_app
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if (Test-Path (Join-Path $env:INSTALL_DIR 'scripts\stop-scyzoryk.ps1')) {
            powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:INSTALL_DIR 'scripts\stop-scyzoryk.ps1')
          }
          Start-Sleep -Seconds 2
          Write-Host "Zatrzymano (jesli byly uruchomione)."

      - name: "Ponowna instalacja (nadpisanie istniejącej instalacji)"
        id: reinstall
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem "artifact\*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $installLog = Join-Path $env:LOGS_DIR 'install\reinstall.log'
          $args = @('/VERYSILENT','/SUPPRESSMSG','/NORESTART','/CURRENTUSER',"/DIR=""$env:INSTALL_DIR""","/LOG=""$installLog""")
          $proc = Start-Process -FilePath $installer.FullName -ArgumentList $args -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Ponowna instalacja zakonczyla sie kodem $($proc.ExitCode)." }
          if (-not (Test-Path (Join-Path $env:INSTALL_DIR 'node-runtime\node.exe'))) { throw "Po ponownej instalacji brakuje bundlowanego node-runtime." }
          Write-Host "OK - ponowna instalacja (nad istniejaca instalacja) powiodla sie."

      - name: Odinstaluj aplikację i sprawdź poprawność usunięcia
        id: uninstall
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path (Join-Path $env:INSTALL_DIR 'scripts\stop-scyzoryk.ps1')) {
            powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:INSTALL_DIR 'scripts\stop-scyzoryk.ps1')
          }
          $uninstaller = Join-Path $env:INSTALL_DIR 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw "Brak deinstalatora: $uninstaller" }
          $uninstallLog = Join-Path $env:LOGS_DIR 'install\uninstall.log'
          $proc = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSG','/NORESTART',"/LOG=""$uninstallLog""") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Deinstalator zakonczyl sie kodem $($proc.ExitCode)." }

          $deadline = (Get-Date).AddSeconds(15)
          while ((Test-Path $env:INSTALL_DIR) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path $env:INSTALL_DIR) {
            $leftover = Get-ChildItem $env:INSTALL_DIR -Recurse -ErrorAction SilentlyContinue
            if ($leftover) {
              $leftover | Select-Object -First 20 -ExpandProperty FullName | ForEach-Object { Write-Host "POZOSTALO PO ODINSTALOWANIU: $_" }
              throw "Po odinstalowaniu folder instalacji nadal zawiera $($leftover.Count) elementow."
            }
          }
          Write-Host "OK - odinstalowano, folder instalacji jest pusty/usunięty."

      - name: Prześlij logi, raporty i zrzuty ekranu jako artefakty (zawsze, nawet przy błędzie)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raport-czystej-instalacji
          path: ${{ env.LOGS_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Wymuś niepowodzenie workflow, jeśli którykolwiek test zawiódł
        if: always()
        shell: pwsh
        run: |
          $results = [ordered]@{
            'install'                = '${{ steps.install.outcome }}'
            'verify'                 = '${{ steps.verify.outcome }}'
            'no_leaked_paths'        = '${{ steps.no_leaked_paths.outcome }}'
            'test_drukarka_projekty' = '${{ steps.test_drukarka_projekty.outcome }}'
            'sample_pdf'             = '${{ steps.sample_pdf.outcome }}'
            'launch'                 = '${{ steps.launch.outcome }}'
            'health'                 = '${{ steps.health.outcome }}'
            'screenshots'            = '${{ steps.screenshots.outcome }}'
            'test_pieczatki'         = '${{ steps.test_pieczatki.outcome }}'
            'test_drukarka'          = '${{ steps.test_drukarka.outcome }}'
            'test_other_apps'        = '${{ steps.test_other_apps.outcome }}'
            'reinstall'              = '${{ steps.reinstall.outcome }}'
            'uninstall'              = '${{ steps.uninstall.outcome }}'
          }
          Write-Host "=== Podsumowanie testu czystej instalacji ==="
          $failed = @()
          foreach ($k in $results.Keys) {
            $v = $results[$k]
            Write-Host ("{0,-26} {1}" -f $k, $v)
            if ($v -ne 'success') { $failed += $k }
          }
          if ($failed.Count -gt 0) {
            Write-Host ""
            Write-Error "Nie powiodly sie etapy: $($failed -join ', ') - zobacz artefakt 'raport-czystej-instalacji'."
            exit 1
          }
          Write-Host "`nWszystkie etapy zakonczone sukcesem."
