name: Test Discord build-log

on:
  workflow_dispatch:

jobs:
  test-discord:
    runs-on: windows-latest

    env:
      DISCORD_BUILD_WEBHOOK: ${{ secrets.DISCORD_BUILD_WEBHOOK }}

    steps:
      - name: Pobierz repo
        uses: actions/checkout@v4

      - name: Test START
        shell: pwsh
        run: |
          & '.\scripts\ci\discord-build-log.ps1' `
            -Status "🚀 **TEST RELEASE v9.9.9 — START**" `
            -Details "Test właściwego systemu powiadomień release."

      - name: Test CHECK
        shell: pwsh
        run: |
          & '.\scripts\ci\discord-build-log.ps1' `
            -Status "✅ **CHECK PASS**" `
            -Details "Test komunikatu po sprawdzeniu projektu."

      - name: Test REGRESSIONS
        shell: pwsh
        run: |
          & '.\scripts\ci\discord-build-log.ps1' `
            -Status "✅ **REGRESSION TESTS PASS**" `
            -Details "Test komunikatu po regresjach."

      - name: Test BUILD
        shell: pwsh
        run: |
          & '.\scripts\ci\discord-build-log.ps1' `
            -Status "🔨 **INSTALLERS BUILT**" `
            -Details "Test komunikatu po zbudowaniu instalatorów."

      - name: Test FINAL
        shell: pwsh
        run: |
          & '.\scripts\ci\discord-build-log.ps1' `
            -Status "🎉 **SCYZORYK v9.9.9 TEST COMPLETED**" `
            -Details "System powiadomień GitHub Actions → Discord działa poprawnie."