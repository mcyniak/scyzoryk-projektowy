name: Zbuduj gotowy instalator Windows z OCR

# Jeden kontrolowany przebieg:
# 1. budowa instalatora probnego,
# 2. swieza instalacja, testy i zrzuty ekranow,
# 3. finalna budowa ze zrzutami w instrukcji,
# 4. ponowna swieza instalacja i pelna weryfikacja finalnego EXE.
# Workflow nie uruchamia sie przy zwyklych commitach.

on:
  workflow_dispatch: {}
  push:
    branches: [ui-redesign-v1]
    paths:
      - '.github/run-ready-installer'

permissions:
  contents: read

concurrency:
  group: gotowy-instalator-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  OCR_DOCAI_PROJECT_ID: scyzoryk-ocr-test
  OCR_DOCAI_LOCATION: eu
  OCR_DOCAI_PROCESSOR_ID: c8cea9ff6f6430c3

jobs:
  build_preview:
    name: 1. Zbuduj instalator probny
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Sprawdz sekret OCR
        shell: pwsh
        env:
          OCR_DOCAI_CREDENTIALS_B64: ${{ secrets.OCR_DOCAI_CREDENTIALS_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:OCR_DOCAI_CREDENTIALS_B64)) {
            throw 'Brakuje GitHub Actions Secret: OCR_DOCAI_CREDENTIALS_B64.'
          }
          try {
            $bytes = [Convert]::FromBase64String($env:OCR_DOCAI_CREDENTIALS_B64)
            $json = [Text.Encoding]::UTF8.GetString($bytes) | ConvertFrom-Json
          } catch {
            throw 'OCR_DOCAI_CREDENTIALS_B64 nie jest poprawnym plikiem JSON zakodowanym Base64.'
          }
          if ($json.type -ne 'service_account' -or [string]::IsNullOrWhiteSpace([string]$json.private_key)) {
            throw 'Sekret OCR nie zawiera kompletnego konta serwisowego Google Cloud.'
          }
          Write-Host 'Sekret OCR jest dostepny i ma poprawny format.'

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Upewnij sie, ze Inno Setup jest dostepne
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) { choco install innosetup --no-progress -y }

      - name: Zbuduj instalator probny z OCR
        shell: pwsh
        env:
          OCR_DOCAI_CREDENTIALS_B64: ${{ secrets.OCR_DOCAI_CREDENTIALS_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          npm run build-installer
          $installer = Get-ChildItem release\*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Nie powstal instalator EXE.' }
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List

      - name: Przekaz instalator probny
        uses: actions/upload-artifact@v4
        with:
          name: instalator-probny-${{ github.run_id }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 1

  capture_and_test:
    name: 2. Swieza instalacja, testy i zrzuty
    needs: build_preview
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Pobierz kod i skrypty testowe
        uses: actions/checkout@v4

      - name: Pobierz instalator probny
        uses: actions/download-artifact@v4
        with:
          name: instalator-probny-${{ github.run_id }}
          path: artifact

      - name: Przygotuj sciezki
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'artifact\*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Nie znaleziono instalatora probnego.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'Scyzoryk Test zrzutow'
          $logsDir = Join-Path $env:RUNNER_TEMP 'scyzoryk-test-zrzuty'
          New-Item -ItemType Directory -Force -Path $logsDir | Out-Null
          "INSTALLER_FILE=$($installer.FullName)" >> $env:GITHUB_ENV
          "INSTALL_DIR=$installDir" >> $env:GITHUB_ENV
          "LOGS_DIR=$logsDir" >> $env:GITHUB_ENV

      - name: Zainstaluj, przetestuj i wykonaj zrzuty
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\scripts\ci\test-installed-scyzoryk.ps1' `
            -InstallerPath $env:INSTALLER_FILE `
            -InstallDir $env:INSTALL_DIR `
            -LogsDir $env:LOGS_DIR `
            -ExpectBundledOcr

      - name: Sprawdz komplet zrzutow instrukcji
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            '01-panel.png',
            '02-drukarka.png',
            '03-pieczatki.png',
            '04-formularze.png',
            '05-dokumenty-seryjne.png',
            '06-wnioski.png',
            '07-karty.png',
            '08-drukarka-projekty.png',
            '09-ocr.png'
          )
          foreach ($name in $required) {
            $file = Join-Path $env:LOGS_DIR "screenshots\$name"
            if (-not (Test-Path -LiteralPath $file)) { throw "Brakuje zrzutu: $name" }
          }

      - name: Przekaz aktualne zrzuty do finalnego builda
        uses: actions/upload-artifact@v4
        with:
          name: aktualne-zrzuty-instrukcji-${{ github.run_id }}
          path: ${{ env.LOGS_DIR }}/screenshots/*.png
          if-no-files-found: error
          retention-days: 1

      - name: Przeslij raport z pierwszej instalacji
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raport-testow-probnego-instalatora
          path: ${{ env.LOGS_DIR }}
          if-no-files-found: warn
          retention-days: 14

  build_final:
    name: 3. Zbuduj finalny instalator z instrukcja
    needs: capture_and_test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Pobierz aktualne zrzuty
        uses: actions/download-artifact@v4
        with:
          name: aktualne-zrzuty-instrukcji-${{ github.run_id }}
          path: public/instrukcja-images

      - name: Sprawdz pliki instrukcji
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            '01-panel.png',
            '02-drukarka.png',
            '03-pieczatki.png',
            '04-formularze.png',
            '05-dokumenty-seryjne.png',
            '06-wnioski.png',
            '07-karty.png',
            '08-drukarka-projekty.png',
            '09-ocr.png'
          )
          foreach ($name in $required) {
            $file = Join-Path $PWD "public\instrukcja-images\$name"
            if (-not (Test-Path -LiteralPath $file)) { throw "Brakuje zrzutu w finalnym buildzie: $name" }
          }
          if (-not (Test-Path 'public\instrukcja.html')) { throw 'Brakuje public\instrukcja.html.' }

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Upewnij sie, ze Inno Setup jest dostepne
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) { choco install innosetup --no-progress -y }

      - name: Zbuduj finalny instalator z OCR i aktualnymi zrzutami
        shell: pwsh
        env:
          OCR_DOCAI_CREDENTIALS_B64: ${{ secrets.OCR_DOCAI_CREDENTIALS_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          npm run build-installer
          $installer = Get-ChildItem release\*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Nie powstal finalny instalator EXE.' }
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List

      - name: Przekaz finalny instalator do weryfikacji
        uses: actions/upload-artifact@v4
        with:
          name: finalny-kandydat-${{ github.run_id }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 1

  verify_final:
    name: 4. Zweryfikuj finalny instalator
    needs: build_final
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Pobierz kod i skrypty testowe
        uses: actions/checkout@v4

      - name: Pobierz finalny instalator
        uses: actions/download-artifact@v4
        with:
          name: finalny-kandydat-${{ github.run_id }}
          path: artifact

      - name: Przygotuj sciezki finalnej weryfikacji
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'artifact\*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Nie znaleziono finalnego instalatora.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'Scyzoryk Test finalny'
          $logsDir = Join-Path $env:RUNNER_TEMP 'scyzoryk-test-finalny'
          New-Item -ItemType Directory -Force -Path $logsDir | Out-Null
          "INSTALLER_FILE=$($installer.FullName)" >> $env:GITHUB_ENV
          "INSTALL_DIR=$installDir" >> $env:GITHUB_ENV
          "LOGS_DIR=$logsDir" >> $env:GITHUB_ENV

      - name: Swieza instalacja i pelne testy finalnego EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\scripts\ci\test-installed-scyzoryk.ps1' `
            -InstallerPath $env:INSTALLER_FILE `
            -InstallDir $env:INSTALL_DIR `
            -LogsDir $env:LOGS_DIR `
            -ExpectBundledOcr `
            -TestLiveOcr

      - name: Przeslij raport finalnej weryfikacji
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raport-finalnej-weryfikacji
          path: ${{ env.LOGS_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Udostepnij przetestowany instalator
        uses: actions/upload-artifact@v4
        with:
          name: Scyzoryk-Projektowy-gotowy-Windows-z-OCR
          path: artifact/*.exe
          if-no-files-found: error
          retention-days: 14
