name: Zbuduj gotowy instalator Windows

# Jeden kontrolowany przebieg z dwiema swiezymi maszynami:
# 1. checkout, build probny, instalacja/testy, zrzuty i finalny build,
# 2. pobranie finalnego EXE, swieza instalacja, pelna weryfikacja i publikacja.
# Workflow nie uruchamia sie przy zwyklych commitach.
#
# Od 2026-08-12 (migracja OCR audytow z Document AI na Google Gemini) instalator
# nie zawiera juz zadnego wbudowanego sekretu - klucz API Gemini uzytkownik
# wpisuje recznie w aplikacji. Ten workflow nie potrzebuje juz sekretow ani
# gwarancji prywatnego repozytorium.

on:
  workflow_dispatch: {}
  push:
    branches: [ui-redesign-v1]
    paths:
      - '.github/run-ready-installer'

permissions:
  contents: read

concurrency:
  group: gotowy-instalator-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare_final:
    name: 1. Zbuduj, przetestuj i przygotuj finalny instalator
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Przygotuj .NET SDK (launcher Scyzoryk.exe)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Upewnij sie, ze Inno Setup jest dostepne
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) { choco install innosetup --no-progress -y }

      - name: Zbuduj instalator probny
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run build-installer
          $installer = Get-ChildItem release\*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Nie powstal instalator probny EXE.' }

          $installDir = Join-Path $env:RUNNER_TEMP 'Scyzoryk Test zrzutow'
          $logsDir = Join-Path $env:RUNNER_TEMP 'scyzoryk-test-zrzuty'
          New-Item -ItemType Directory -Force -Path $logsDir | Out-Null

          "PREVIEW_INSTALLER=$($installer.FullName)" >> $env:GITHUB_ENV
          "PREVIEW_INSTALL_DIR=$installDir" >> $env:GITHUB_ENV
          "PREVIEW_LOGS_DIR=$logsDir" >> $env:GITHUB_ENV
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List

      - name: Zainstaluj, przetestuj i wykonaj aktualne zrzuty
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\scripts\ci\test-installed-scyzoryk.ps1' `
            -InstallerPath $env:PREVIEW_INSTALLER `
            -InstallDir $env:PREVIEW_INSTALL_DIR `
            -LogsDir $env:PREVIEW_LOGS_DIR

      - name: Wstaw aktualne zrzuty do instrukcji
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:PREVIEW_LOGS_DIR 'screenshots'
          $target = Join-Path $PWD 'public\instrukcja-images'
          $required = @(
            '01-panel.png',
            '02-drukarka.png',
            '03-pieczatki.png',
            '04-formularze.png',
            '05-dokumenty-seryjne.png',
            '06-wnioski.png',
            '07-karty.png',
            '08-drukarka-projekty.png',
            '09-ocr.png',
            '11-varmero.png',
            '12-nazywarka-skanow.png',
            '13-tworzenie-folderow.png',
            '14-protokoly.png'
          )

          New-Item -ItemType Directory -Force -Path $target | Out-Null
          foreach ($name in $required) {
            $file = Join-Path $source $name
            if (-not (Test-Path -LiteralPath $file)) { throw "Brakuje zrzutu instrukcji: $name" }
            Copy-Item -LiteralPath $file -Destination (Join-Path $target $name) -Force
          }

          if (-not (Test-Path 'public\instrukcja.html')) { throw 'Brakuje public\instrukcja.html.' }
          Get-ChildItem $target -Filter '*.png' | Format-Table Name, Length

      - name: Zbuduj finalny instalator z aktualnymi zrzutami
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item release\*.exe -Force -ErrorAction SilentlyContinue
          npm run build-installer
          $installer = Get-ChildItem release\*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Nie powstal finalny instalator EXE.' }
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List

      - name: Przekaz finalny instalator do swiezej weryfikacji
        uses: actions/upload-artifact@v4
        with:
          name: finalny-kandydat-${{ github.run_id }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Przeslij raport z przygotowania finalnego instalatora
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raport-przygotowania-finalnego-instalatora
          path: ${{ env.PREVIEW_LOGS_DIR }}
          if-no-files-found: warn
          retention-days: 14

  verify_final:
    name: 2. Zweryfikuj i opublikuj finalny instalator
    needs: prepare_final
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Pobierz kod i skrypty testowe
        uses: actions/checkout@v4

      - name: Pobierz finalny instalator
        uses: actions/download-artifact@v4
        with:
          name: finalny-kandydat-${{ github.run_id }}
          path: artifact

      - name: Przygotuj sciezki finalnej weryfikacji
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'artifact\*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Nie znaleziono finalnego instalatora.' }

          $installDir = Join-Path $env:RUNNER_TEMP 'Scyzoryk Test finalny'
          $logsDir = Join-Path $env:RUNNER_TEMP 'scyzoryk-test-finalny'
          New-Item -ItemType Directory -Force -Path $logsDir | Out-Null

          "INSTALLER_FILE=$($installer.FullName)" >> $env:GITHUB_ENV
          "INSTALL_DIR=$installDir" >> $env:GITHUB_ENV
          "LOGS_DIR=$logsDir" >> $env:GITHUB_ENV

      - name: Swieza instalacja i pelne testy finalnego EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\scripts\ci\test-installed-scyzoryk.ps1' `
            -InstallerPath $env:INSTALLER_FILE `
            -InstallDir $env:INSTALL_DIR `
            -LogsDir $env:LOGS_DIR

      - name: Przeslij raport finalnej weryfikacji
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raport-finalnej-weryfikacji
          path: ${{ env.LOGS_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Udostepnij przetestowany instalator
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Scyzoryk-Projektowy-gotowy-Windows
          path: artifact/*.exe
          if-no-files-found: error
          retention-days: 14
