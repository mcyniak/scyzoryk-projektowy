name: Opublikuj publiczny instalator (GitHub Release)

# Publikuje PUBLICZNY instalator (bez zadnych sekretow OCR) jako GitHub
# Release, ale tylko po przejsciu wszystkich testow. To jest zrodlo, z
# ktorego korzysta wbudowany mechanizm aktualizacji Scyzoryka
# (lib/updateService.js) - GET /repos/{repo}/releases/latest.
#
# Wyzwalane tagiem w formacie SemVer "vMAJOR.MINOR.PATCH" (patrz
# lib/updateVersion.js dla dokladnego formatu porownywanego przez sama
# aplikacje). Recznie (workflow_dispatch) rowniez mozliwe - walidacja wersji
# jest IDENTYCZNA w obu przypadkach, nie da sie jej obejsc.
#
# Ten workflow NIGDY nie dostaje sekretu OCR_DOCAI_CREDENTIALS_B64 - publiczny
# instalator jest budowany tak jak w build-internal-installer.yml (bez OCR).

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do opublikowania (np. v1.2.0) - musi juz istniec w repo.'
        required: true

permissions:
  contents: write

concurrency:
  group: release-publiczny-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Zbuduj, przetestuj i opublikuj publiczny instalator
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Pobierz kod repozytorium (dokladnie ten tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Ustal i zwaliduj wersje (tag Git vs package.json)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tagRef = '${{ github.event.inputs.tag }}'
          if ([string]::IsNullOrWhiteSpace($tagRef)) { $tagRef = '${{ github.ref_name }}' }
          if ($tagRef -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Tag '$tagRef' nie ma formatu SemVer 'vMAJOR.MINOR.PATCH' (np. v1.2.0)."
          }
          $tagVersion = $Matches[1]
          $packageVersion = (Get-Content -Raw 'package.json' | ConvertFrom-Json).version
          if ($tagVersion -ne $packageVersion) {
            throw "Tag Git ($tagRef -> wersja $tagVersion) nie zgadza sie z package.json (wersja $packageVersion). Publikacja przerwana PRZED zbudowaniem instalatora - popraw jedno albo drugie i utworz tag ponownie."
          }
          Write-Host "Wersja zgodna: tag=$tagRef, package.json=$packageVersion"
          "RELEASE_VERSION=$tagVersion" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tagRef" >> $env:GITHUB_ENV

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Audyt v1.1.7: cache npm keyowany hashem WSZYSTKICH lockfilow w
          # repo (root + kazda apps/*) - kiedy zaden lockfile sie nie zmienil
          # (typowy przypadek dla releasu, ktory zmienia tylko kod aplikacji),
          # `npm ci` w install-all.js ciagnie paczki z lokalnego cache
          # zamiast na nowo z sieci. Nie przyspiesza samego pobrania Chromium
          # przez Playwright (PLAYWRIGHT_BROWSERS_PATH=0 wiazie je wewnatrz
          # node_modules, ktore `npm ci` i tak zawsze czysci i buduje od
          # nowa) - to zostaje najwiekszym pojedynczym kosztem czasowym.
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/*/package-lock.json

      - name: Przygotuj .NET SDK (launcher Scyzoryk.exe)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Sprawdz caly projekt (node --check + parser PowerShell)
        shell: pwsh
        run: npm run check

      - name: Zainstaluj zaleznosci wszystkich aplikacji (wymagane przez testy jednostkowe)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Niektore istniejace testy (np. test/group3-ocr.test.js,
          # test/group4-ecodan.test.js) require() bezposrednio wlasny
          # node_modules danej aplikacji (np. pdf-lib z apps/ocr-audytow) -
          # bez tego kroku failowaly na swiezym checkoucie z MODULE_NOT_FOUND,
          # mimo ze kod byl poprawny (zlapane realnie w tym workflow).
          npm run install-all
          if ($LASTEXITCODE -ne 0) { throw 'Instalacja zaleznosci aplikacji nie powiodla sie.' }

      - name: Uruchom testy regresyjne
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Audyt v1.1.7: ten krok kiedys szedl PO osobnej petli "npm run
          # test:groupN" dla kazdej grupy z osobna - test:regressions
          # (scripts/run-regression-tests.js) i tak automatycznie odkrywa i
          # uruchamia WSZYSTKIE test/group*.test.js (plus dodatkowo
          # regresje sortowania drukarki-projekty), wiec caly zestaw
          # testow byl uruchamiany DWA RAZY z rzedu bez zadnej dodatkowej
          # wartosci - czysta strata czasu w kazdym releasie.
          npm run test:regressions
          if ($LASTEXITCODE -ne 0) { throw 'Testy regresyjne nie powiodly sie.' }

      - name: Upewnij sie, ze Inno Setup jest dostepne
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) { choco install innosetup --no-progress -y }

      - name: Zbuduj publiczne instalatory (pelny + aktualizacyjny, bez OCR, wersja z package.json)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run build-installer

          # Audyt 2026-08-06: od teraz DWA pliki .exe - pelny (offline, z
          # node_modules/Chromium) i maly aktualizacyjny (bez nich, patrz
          # scripts\build-installer.ps1/installer\scyzoryk.iss). Nazwy
          # znajdujemy jawnie, nigdy przez "pierwszy pasujacy plik" - kolejnosc
          # alfabetyczna to przypadek, nie kontrakt.
          $fullPath = Join-Path 'release' "ScyzorykProjektowy-Setup-$env:RELEASE_VERSION.exe"
          $updatePath = Join-Path 'release' "ScyzorykProjektowy-Update-$env:RELEASE_VERSION.exe"
          $fingerprintPath = Join-Path 'release' 'runtime-fingerprint.txt'
          if (-not (Test-Path $fullPath)) { throw "Brak pelnego instalatora: $fullPath" }
          if (-not (Test-Path $updatePath)) { throw "Brak instalatora aktualizacyjnego: $updatePath" }
          if (-not (Test-Path $fingerprintPath)) { throw "Brak runtime-fingerprint.txt: $fingerprintPath" }

          "FULL_INSTALLER_PATH=$((Resolve-Path $fullPath).Path)" >> $env:GITHUB_ENV
          "FULL_INSTALLER_NAME=$(Split-Path -Leaf $fullPath)" >> $env:GITHUB_ENV
          "UPDATE_INSTALLER_PATH=$((Resolve-Path $updatePath).Path)" >> $env:GITHUB_ENV
          "UPDATE_INSTALLER_NAME=$(Split-Path -Leaf $updatePath)" >> $env:GITHUB_ENV
          "FINGERPRINT_PATH=$((Resolve-Path $fingerprintPath).Path)" >> $env:GITHUB_ENV

      - name: Sprawdz, ze ZADEN publiczny instalator nie zawiera konfiguracji OCR
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Test-NoOcrSecret([string]$InstallerPath, [string]$Label) {
            $installDir = Join-Path $env:RUNNER_TEMP "Scyzoryk Sprawdzenie Sekretow $Label"
            $proc = Start-Process -FilePath $InstallerPath -ArgumentList @(
              '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/MERGETASKS=!autostart', "/DIR=`"$installDir`""
            ) -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "Instalacja testowa ($Label, sprawdzenie sekretow) zakonczyla sie kodem $($proc.ExitCode)." }

            $forbidden = @(Get-ChildItem -Path $installDir -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -eq 'service-account.json' -or $_.Name -eq 'document-ai.json' })

            if (Test-Path (Join-Path $installDir 'Scyzoryk.exe')) {
              & (Join-Path $installDir 'Scyzoryk.exe') --stop
            }
            if (Test-Path (Join-Path $installDir 'unins000.exe')) {
              Start-Process -FilePath (Join-Path $installDir 'unins000.exe') -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru | Out-Null
            }

            if ($forbidden.Count -gt 0) {
              throw "Publiczny instalator ($Label) zawiera zabronione pliki sekretne: $($forbidden.FullName -join ', ')"
            }
            Write-Host "Potwierdzono ($Label): brak konfiguracji OCR."
          }

          # Wariant "update" NIE ma node_modules, ale konfiguracja OCR (jesli
          # w ogole by trafila do stagingu) idzie przez ta sama, wspolna
          # sekcje [Files] co reszta kodu aplikacji - musi byc sprawdzony
          # rownie dokladnie jak pelny.
          Test-NoOcrSecret -InstallerPath $env:FULL_INSTALLER_PATH -Label 'full'
          Test-NoOcrSecret -InstallerPath $env:UPDATE_INSTALLER_PATH -Label 'update'

      - name: Zainstaluj i w pelni przetestuj oba publiczne instalatory na swiezym Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:RUNNER_TEMP 'Scyzoryk Release Test'
          $logsDir = Join-Path $env:RUNNER_TEMP 'scyzoryk-release-logs'
          New-Item -ItemType Directory -Force -Path $logsDir | Out-Null
          & '.\scripts\ci\test-installed-scyzoryk.ps1' `
            -InstallerPath $env:FULL_INSTALLER_PATH `
            -UpdateInstallerPath $env:UPDATE_INSTALLER_PATH `
            -InstallDir $installDir `
            -LogsDir $logsDir

      - name: Przeslij raport testu instalatora
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raport-release-${{ env.RELEASE_VERSION }}
          path: ${{ runner.temp }}/scyzoryk-release-logs
          if-no-files-found: warn
          retention-days: 14

      - name: Oblicz SHA-256 obu instalatorow i utworz pliki .sha256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function New-ShaFile([string]$InstallerPath, [string]$InstallerName) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $InstallerPath).Hash
            $shaLine = "$hash  $InstallerName"
            $shaPath = "$InstallerPath.sha256"
            [IO.File]::WriteAllText($shaPath, "$shaLine`n", [Text.ASCIIEncoding]::new())
            Write-Host $shaLine
            return $shaPath
          }

          $fullSha = New-ShaFile -InstallerPath $env:FULL_INSTALLER_PATH -InstallerName $env:FULL_INSTALLER_NAME
          $updateSha = New-ShaFile -InstallerPath $env:UPDATE_INSTALLER_PATH -InstallerName $env:UPDATE_INSTALLER_NAME
          "FULL_SHA_PATH=$fullSha" >> $env:GITHUB_ENV
          "UPDATE_SHA_PATH=$updateSha" >> $env:GITHUB_ENV

      - name: Utworz GitHub Release i dodaj oba instalatory + sumy kontrolne + fingerprint runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # runtime-fingerprint.txt jako WLASNY, maly asset - lib/updateService.js
          # go pobiera osobno, zeby zdecydowac czy wystarczy maly instalator
          # aktualizacyjny, bez pobierania ktoregokolwiek z duzych plikow .exe.
          gh release create "$env:RELEASE_TAG" `
            "$env:FULL_INSTALLER_PATH" "$env:FULL_SHA_PATH" `
            "$env:UPDATE_INSTALLER_PATH" "$env:UPDATE_SHA_PATH" `
            "$env:FINGERPRINT_PATH" `
            --title "Scyzoryk $env:RELEASE_VERSION" `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create zakonczylo sie kodem $LASTEXITCODE." }
