name: Zbuduj instalator deweloperski bez OCR

# Ten workflow buduje instalator bez sekretow. Sluzy do testow technicznych,
# a nie do przekazywania pracownikom. Gotowy instalator dla uzytkownika koncowego
# buduje osobny workflow build-ready-installer.yml.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'public/**'
      - 'lib/**'
      - 'server.js'
      - 'package.json'
      - 'scripts/**'
      - 'installer/**'
      - '.github/workflows/build-internal-installer.yml'

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Zbuduj instalator bez OCR
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Upewnij sie, ze Inno Setup jest dostepny
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) { choco install innosetup --no-progress -y }

      - name: Zbuduj instalator deweloperski
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run build-installer
          Get-ChildItem release | Format-Table Name, Length

      - name: Przekaz instalator do testu
        uses: actions/upload-artifact@v4
        with:
          name: techniczny-instalator-bez-ocr-${{ github.run_id }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 1

  test:
    name: Swieza instalacja bez OCR i pelne testy
    needs: build
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Pobierz skrypty testowe
        uses: actions/checkout@v4

      - name: Pobierz instalator z poprzedniego joba
        uses: actions/download-artifact@v4
        with:
          name: techniczny-instalator-bez-ocr-${{ github.run_id }}
          path: artifact

      - name: Przygotuj sciezki
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'artifact\*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Nie znaleziono instalatora.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'Scyzoryk Test swieza instalacja bez OCR'
          $logsDir = Join-Path $env:RUNNER_TEMP 'scyzoryk-test-logs-bez-ocr'
          New-Item -ItemType Directory -Force -Path $logsDir | Out-Null
          "INSTALLER_FILE=$($installer.FullName)" >> $env:GITHUB_ENV
          "INSTALL_DIR=$installDir" >> $env:GITHUB_ENV
          "LOGS_DIR=$logsDir" >> $env:GITHUB_ENV

      - name: Zainstaluj i przetestuj caly Scyzoryk bez OCR
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\scripts\ci\test-installed-scyzoryk.ps1' `
            -InstallerPath $env:INSTALLER_FILE `
            -InstallDir $env:INSTALL_DIR `
            -LogsDir $env:LOGS_DIR

      - name: Przeslij raporty i zrzuty ekranow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raport-testow-instalatora-bez-ocr
          path: ${{ env.LOGS_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Udostepnij przetestowany instalator deweloperski
        uses: actions/upload-artifact@v4
        with:
          name: Scyzoryk-Projektowy-DEWELOPERSKI-bez-OCR
          path: artifact/*.exe
          if-no-files-found: error
          retention-days: 3

      - name: Usun techniczny artefakt posredni
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = 'techniczny-instalator-bez-ocr-${{ github.run_id }}'
          $response = gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" | ConvertFrom-Json
          $artifact = $response.artifacts | Where-Object { $_.name -eq $name } | Select-Object -First 1
          if ($artifact) {
            gh api --method DELETE "/repos/${{ github.repository }}/actions/artifacts/$($artifact.id)"
          }
